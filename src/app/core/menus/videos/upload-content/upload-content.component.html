<div class="video-list">
  <table mat-table [dataSource]="videos">
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox></mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let video">
        <mat-checkbox></mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="video">
      <th mat-header-cell *matHeaderCellDef>Video</th>
      <td mat-cell *matCellDef="let video">
        <img [src]="video.thumbnail" width="120" height="90" alt="Miniatura" />
        <div>{{ video.title }}</div>
        <div>{{ video.description }}</div>
      </td>
    </ng-container>

    <ng-container matColumnDef="visibility">
      <th mat-header-cell *matHeaderCellDef>Visibilidad</th>
      <td mat-cell *matCellDef="let video">
        <mat-select
          [(value)]="video.visibility"
          (selectionChange)="updateVisibility(video.id, video.visibility)"
        >
          <mat-option
            *ngFor="let option of visibilityOptions"
            [value]="option"
            >{{ option }}</mat-option
          >
        </mat-select>
      </td>
    </ng-container>

    <ng-container matColumnDef="restrictions">
      <th mat-header-cell *matHeaderCellDef>Restricciones</th>
      <td mat-cell *matCellDef="let video">{{ video.restrictions }}</td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let video">{{ video.date }}</td>
    </ng-container>

    <ng-container matColumnDef="views">
      <th mat-header-cell *matHeaderCellDef>Vistas</th>
      <td mat-cell *matCellDef="let video">{{ video.views }}</td>
    </ng-container>

    <ng-container matColumnDef="comments">
      <th mat-header-cell *matHeaderCellDef>Comentarios</th>
      <td mat-cell *matCellDef="let video">{{ video.comments }}</td>
    </ng-container>

    <ng-container matColumnDef="likes">
      <th mat-header-cell *matHeaderCellDef>Likes</th>
      <td mat-cell *matCellDef="let video">{{ video.likes }}</td>
    </ng-container>
    
    <ng-container matColumnDef="dislikes">
      <th mat-header-cell *matHeaderCellDef>Dislikes</th>
      <td mat-cell *matCellDef="let video">{{ video.dislikes }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
